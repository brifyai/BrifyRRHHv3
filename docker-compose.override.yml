# Docker Compose Override File
# El docker-compose.yml principal ya NO incluye analytics
# Este override está aquí por si Easypanel intenta agregarlo

version: "3.8"

services:
  # Si Easypanel intenta crear analytics, este override lo deshabilita
  analytics:
    image: alpine:latest
    entrypoint: ["/bin/sh"]
    command: ["-c", "echo 'Analytics disabled - not needed' && exit 0"]
    ports: []
    restart: "no"
    profiles:
      - disabled
