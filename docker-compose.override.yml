# Docker Compose Override File
# Este archivo DESHABILITA analytics para evitar conflicto de puerto 4000
# 
# IMPORTANTE: Este override debe tener prioridad sobre el que genera EasyPanel

version: "3.8"

services:
  # DESHABILITAR analytics - no exponer ningún puerto
  analytics:
    command: ["sh", "-c", "echo 'Analytics disabled' && sleep infinity"]
    ports: []
    restart: "no"
  
  # Kong NO debe depender de analytics
  kong:
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      rest:
        condition: service_started
      realtime:
        condition: service_started
      storage:
        condition: service_started
