# Docker Compose Override File
# Este archivo ELIMINA completamente el servicio analytics y cambia puertos conflictivos
# 
# IMPORTANTE: Este override debe tener prioridad sobre el que genera EasyPanel

version: "3.8"

services:
  # ELIMINAR analytics completamente - usar scale=0 para que no se cree
  analytics:
    scale: 0
    image: tianon/true
    restart: "no"
    command: ["true"]
    profiles:
      - disabled
    ports: []
    networks: []
  
  # Kong NO debe depender de analytics
  kong:
    depends_on:
      db:
        condition: service_healthy
    # Eliminar cualquier dependencia de analytics
