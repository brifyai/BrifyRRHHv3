# Docker Compose Override File
# Este archivo ELIMINA completamente el servicio analytics
# 
# IMPORTANTE: Este override debe tener prioridad sobre el que genera EasyPanel

version: "3.8"

services:
  # ELIMINAR analytics completamente - no iniciar, no crear, no exponer puertos
  analytics:
    image: tianon/true  # Imagen dummy que no hace nada
    restart: "no"
    command: "true"
    deploy:
      replicas: 0
    profiles:
      - disabled
    # NO exponer ningún puerto
    ports: []
  
  # Kong NO debe depender de analytics
  kong:
    depends_on:
      db:
        condition: service_healthy
    # Eliminar cualquier dependencia de analytics
